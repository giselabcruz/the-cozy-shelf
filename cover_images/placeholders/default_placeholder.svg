<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2424"/>
      <stop offset="100%" stop-color="#443434"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" rx="12" />
  
  <!-- Decorative Frame -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#d4a373" stroke-width="2" rx="8" opacity="0.6"/>
  <rect x="26" y="26" width="348" height="548" fill="none" stroke="#d4a373" stroke-width="1" rx="6" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Icon Illustration -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="220" r="40" fill="#d4a373" opacity="0.5"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="440" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#f5ebe0" text-anchor="middle">
    Cozy Edition
  </text>
  <text x="200" y="470" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#d4a373" text-anchor="middle">
    Digital Book
  </text>

  <!-- Divider Line -->
  <line x1="140" y1="495" x2="260" y2="495" stroke="#d4a373" stroke-width="1.5" opacity="0.7"/>

  <!-- Author -->
  <text x="200" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="2" font-weight="600" fill="#f5ebe0" text-anchor="middle" text-transform="uppercase">
    The Cozy Shelf
  </text>
</svg>