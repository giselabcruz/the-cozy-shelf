<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#203a43"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" rx="12" />
  
  <!-- Decorative Frame -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#e0c3fc" stroke-width="2" rx="8" opacity="0.6"/>
  <rect x="26" y="26" width="348" height="548" fill="none" stroke="#e0c3fc" stroke-width="1" rx="6" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Icon Illustration -->
  <g filter="url(#shadow)">
    
            <path d="M50 380 Q 200 320, 350 380 T 650 380" fill="none" stroke="#8ec5fc" stroke-width="4" opacity="0.6"/>
            <path d="M0 420 Q 180 370, 400 420" fill="none" stroke="#e0c3fc" stroke-width="3" opacity="0.4"/>
            <circle cx="200" cy="220" r="45" fill="none" stroke="#8ec5fc" stroke-width="3" />
            <circle cx="200" cy="220" r="35" fill="#1b2a47" />
            <polygon points="200,140 205,155 220,155 208,165 212,180 200,170 188,180 192,165 180,155 195,155" fill="#8ec5fc"/>
        
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="440" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#2c5364" text-anchor="middle">
    The Ocean at the
  </text>
  <text x="200" y="470" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#e0c3fc" text-anchor="middle">
    End of the Lane
  </text>

  <!-- Divider Line -->
  <line x1="140" y1="495" x2="260" y2="495" stroke="#e0c3fc" stroke-width="1.5" opacity="0.7"/>

  <!-- Author -->
  <text x="200" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="2" font-weight="600" fill="#2c5364" text-anchor="middle" text-transform="uppercase">
    Neil Gaiman
  </text>
</svg>