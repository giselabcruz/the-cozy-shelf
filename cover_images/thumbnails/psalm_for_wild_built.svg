<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" rx="12" />
  
  <!-- Decorative Frame -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#95d5b2" stroke-width="2" rx="8" opacity="0.6"/>
  <rect x="26" y="26" width="348" height="548" fill="none" stroke="#95d5b2" stroke-width="1" rx="6" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Icon Illustration -->
  <g filter="url(#shadow)">
    
            <!-- Tea Leaves & Sun -->
            <circle cx="200" cy="200" r="50" fill="#e9d8a6" opacity="0.8"/>
            <path d="M 200 150 Q 240 200, 200 250 Q 160 200, 200 150 Z" fill="#74c69d"/>
            <path d="M 200 150 L 200 250" stroke="#1b4332" stroke-width="2"/>
        
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="440" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#d8f3dc" text-anchor="middle">
    A Psalm for the
  </text>
  <text x="200" y="470" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#95d5b2" text-anchor="middle">
    Wild-Built
  </text>

  <!-- Divider Line -->
  <line x1="140" y1="495" x2="260" y2="495" stroke="#95d5b2" stroke-width="1.5" opacity="0.7"/>

  <!-- Author -->
  <text x="200" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="2" font-weight="600" fill="#d8f3dc" text-anchor="middle" text-transform="uppercase">
    Becky Chambers
  </text>
</svg>