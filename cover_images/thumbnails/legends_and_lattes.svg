<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" rx="12" />
  
  <!-- Decorative Frame -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#ffb74d" stroke-width="2" rx="8" opacity="0.6"/>
  <rect x="26" y="26" width="348" height="548" fill="none" stroke="#ffb74d" stroke-width="1" rx="6" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Icon Illustration -->
  <g filter="url(#shadow)">
    
            <!-- Coffee Cup with steam -->
            <path d="M 170 230 A 30 30 0 0 0 230 230 L 220 280 A 20 20 0 0 1 180 280 Z" fill="#d7ccc8" />
            <path d="M 230 240 Q 250 240, 250 255 Q 250 270, 225 270" fill="none" stroke="#d7ccc8" stroke-width="4" />
            <path d="M 185 210 Q 180 190, 190 170" fill="none" stroke="#ffb74d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
            <path d="M 200 215 Q 205 195, 198 175" fill="none" stroke="#ffb74d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
            <path d="M 215 210 Q 210 190, 220 170" fill="none" stroke="#ffb74d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
        
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="440" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#d7ccc8" text-anchor="middle">
    Legends & Lattes
  </text>
  <text x="200" y="470" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#ffb74d" text-anchor="middle">
    A Novel of High Fantasy & Low Stakes
  </text>

  <!-- Divider Line -->
  <line x1="140" y1="495" x2="260" y2="495" stroke="#ffb74d" stroke-width="1.5" opacity="0.7"/>

  <!-- Author -->
  <text x="200" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="2" font-weight="600" fill="#d7ccc8" text-anchor="middle" text-transform="uppercase">
    Travis Baldree
  </text>
</svg>