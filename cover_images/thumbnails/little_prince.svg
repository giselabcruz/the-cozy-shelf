<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#172a45"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" rx="12" />
  
  <!-- Decorative Frame -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#ffe066" stroke-width="2" rx="8" opacity="0.6"/>
  <rect x="26" y="26" width="348" height="548" fill="none" stroke="#ffe066" stroke-width="1" rx="6" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Icon Illustration -->
  <g filter="url(#shadow)">
    
            <!-- Asteroid & Rose -->
            <circle cx="200" cy="240" r="55" fill="#3a506b"/>
            <path d="M 200 185 L 200 170" stroke="#48cae4" stroke-width="4"/>
            <circle cx="200" cy="165" r="10" fill="#f72585"/>
            <circle cx="150" cy="120" r="2" fill="#ffe066"/>
            <circle cx="260" cy="100" r="3" fill="#ffe066"/>
            <circle cx="230" cy="150" r="2" fill="#ffe066"/>
            <circle cx="120" cy="180" r="2" fill="#ffe066"/>
        
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="440" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#64ffda" text-anchor="middle">
    The Little Prince
  </text>
  <text x="200" y="470" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#ffe066" text-anchor="middle">
    Antoine de Saint-Exupéry
  </text>

  <!-- Divider Line -->
  <line x1="140" y1="495" x2="260" y2="495" stroke="#ffe066" stroke-width="1.5" opacity="0.7"/>

  <!-- Author -->
  <text x="200" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="2" font-weight="600" fill="#64ffda" text-anchor="middle" text-transform="uppercase">
    Classic Edition
  </text>
</svg>